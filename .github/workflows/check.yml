name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check catalogs and tools
        run: make check
      - name: Build
        run: make
